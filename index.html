<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>odin-library</title>
  </head>
  <body>
    <header>
      <h1>Bibliothèque</h1>
    </header>

    <main>
      <button id="btnAdd">Nouveau livre</button>
      <table>
        <thead>
          <tr>
            <th scope="col">Titre</th>
            <th scope="col">Auteur</th>
            <th scope="col">Pages</th>
            <th scope="col">Statut</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody id="liste-livres"></tbody>
      </table>
    </main>

    <dialog id="dialog">
      <form id="formulaire">
        <h2>Ajouter un livre</h2>
        <label>Titre<input name="titre" required placeholder="ex. Le Seigneur des Anneaux..." /></label>
        <label>Auteur<input name="auteur" required placeholder="ex. J. R. R. Tolkien" /></label>
        <label
          >Pages<input name="pages" required min="1" type="number" value="1" placeholder="nombre de pages"
        /></label>
        <label>déjà lu<input name="lu" type="checkbox" /></label>
        <button type="submit">Ajouter</button>
        <button type="button" id="retour">Retour</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
